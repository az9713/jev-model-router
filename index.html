<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Jev Router</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#fb923c; --accent2:#2dd4bf; --border:#334155; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 120px; }
  h1 { font-size:18px; margin:0 0 16px; color:var(--accent2); }
  .turn { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .q { color:var(--muted); white-space:pre-wrap; margin-bottom:10px; }
  .meta { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:13px; color:var(--muted); margin-bottom:10px; align-items:center; }
  .tier { background:var(--accent); color:#0f172a; font-weight:700; padding:2px 10px; border-radius:999px; text-transform:uppercase; font-size:12px; }
  .bars { display:grid; grid-template-columns:80px 1fr 48px; gap:4px 8px; font-size:12px; margin-bottom:10px; }
  .bar { background:#0f172a; border-radius:4px; overflow:hidden; height:14px; }
  .bar i { display:block; height:100%; background:var(--accent2); }
  .reply { white-space:pre-wrap; border-top:1px solid var(--border); padding-top:10px; }
  form { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--border); padding:12px 16px; }
  .row { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font:inherit; resize:vertical; min-height:44px; }
  button { background:var(--accent2); color:#0f172a; border:0; border-radius:8px; padding:0 18px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .err { color:#f87171; }
</style>
</head>
<body>
<main>
  <h1>Jev model router</h1>
  <div id="log"></div>
</main>
<form id="f">
  <div class="row">
    <textarea id="m" placeholder="Type a message. Jev picks the tier, then that model answers." required></textarea>
    <button id="b">Send</button>
  </div>
</form>
<script>
const log = document.getElementById("log"), f = document.getElementById("f"), m = document.getElementById("m"), b = document.getElementById("b");
const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
f.onsubmit = async e => {
  e.preventDefault();
  const message = m.value.trim(); if (!message) return;
  b.disabled = true;
  const el = document.createElement("div"); el.className = "turn";
  el.innerHTML = `<div class="q">${esc(message)}</div><div class="meta">Asking Jev…</div>`;
  log.append(el); el.scrollIntoView();
  try {
    const r = await (await fetch("/chat", { method: "POST", body: JSON.stringify({ message }) })).json();
    if (r.error) throw new Error(r.error);
    const bars = Object.entries(r.probabilities).map(([k, p]) =>
      `<span>${k}</span><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div><span>${Math.round(p*100)}%</span>`).join("");
    el.innerHTML = `<div class="q">${esc(message)}</div>
      <div class="meta"><span class="tier">${r.tier}</span><span>${r.model}</span><span>confidence ${r.confidence}</span><span>Jev ${r.jevMs} ms</span><span>reply ${r.replyMs} ms</span></div>
      <div class="bars">${bars}</div><div class="reply">${r.replyError ? `<span class="err">${esc(r.model)} refused: ${esc(r.replyError)}</span>` : esc(r.reply)}</div>`;
    m.value = "";
  } catch (err) { el.querySelector(".meta").innerHTML = `<span class="err">${esc(err.message)}</span>`; }
  b.disabled = false; m.focus();
};
m.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } };
</script>
</body>
</html>
